# television channel: all managed prefix lists across the AWS Organization, via aws-find.
# Install: cp television/aws-find-pl.toml ~/.config/television/cable/   then: tv aws-find-pl
# The org-wide scan runs once when the channel opens (10-25 s), then you fuzzy-search the
# result. Rows are cached in $TMPDIR/aws-find-pl.jsonl for the preview and actions.
# Needs a valid Identity Center token: run 'aws-find roles' first if in doubt.

[metadata]
name = "aws-find-pl"
description = "All managed prefix lists in the AWS Organization, searchable by id, name or tag"
requirements = ["aws-find", "jq"]

[source]
command = "aws-find pl '*' --json 2>/dev/null | tee \"${TMPDIR:-/tmp}/aws-find-pl.jsonl\" | jq -r '[.name, .region, .id, (.label // \"-\"), (.detail // \"-\")] | @tsv'"
output = "{split:\t:2}"

[preview]
command = "jq -C --arg id '{split:\t:2}' --arg name '{split:\t:0}' 'select(.id == $id and .name == $name)' \"${TMPDIR:-/tmp}/aws-find-pl.jsonl\""

[ui]
layout = "portrait"
preview_panel = { size = 55 }

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open the selected managed prefix list in the AWS console (Identity Center deep link)"
command = "jq -r --arg id '{split:\t:2}' --arg name '{split:\t:0}' 'select(.id == $id and .name == $name) | .url' \"${TMPDIR:-/tmp}/aws-find-pl.jsonl\" | head -1 | xargs open"
mode = "fork"

[actions.url]
description = "Print the console deep link"
command = "jq -r --arg id '{split:\t:2}' --arg name '{split:\t:0}' 'select(.id == $id and .name == $name) | .url' \"${TMPDIR:-/tmp}/aws-find-pl.jsonl\" | head -1"
mode = "execute"
